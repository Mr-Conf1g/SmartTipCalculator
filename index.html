<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Propinas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculator-container">
        <h1>Calculadora de Propinas</h1>

        <form id="tip-form" class="tip-form" novalidate>
            <div class="form-group">
                <label for="bill-amount">Monto de la cuenta</label>
                <input
                    type="number"
                    id="bill-amount"
                    name="bill-amount"
                    placeholder="0.00"
                    min="0.01"
                    step="0.01"
                    required
                    aria-describedby="bill-error"
                >
                <span id="bill-error" class="error-message" aria-live="polite"></span>
            </div>

            <fieldset class="tip-percentage-group">
                <legend>Porcentaje de propina</legend>

                <div class="quick-tips">
                    <button type="button" class="tip-btn" data-tip="10" aria-pressed="false">10%</button>
                    <button type="button" class="tip-btn" data-tip="15" aria-pressed="false">15%</button>
                    <button type="button" class="tip-btn" data-tip="20" aria-pressed="false">20%</button>
                </div>

                <div class="form-group custom-tip-group">
                    <label for="custom-tip">Personalizado (%)</label>
                    <input
                        type="number"
                        id="custom-tip"
                        name="custom-tip"
                        placeholder="Ej: 18"
                        min="0"
                        max="100"
                        step="1"
                        aria-describedby="tip-error"
                    >
                    <span id="tip-error" class="error-message" aria-live="polite"></span>
                </div>
            </fieldset>

            <button type="submit" class="calculate-btn">Calcular</button>
        </form>

        <div id="results" class="results" hidden>
            <div class="result-row">
                <span class="result-label">Propina:</span>
                <span id="tip-amount" class="result-value">$0.00</span>
            </div>
            <div class="result-row total">
                <span class="result-label">Total a pagar:</span>
                <span id="total-amount" class="result-value">$0.00</span>
            </div>
        </div>

        <div id="error-message" class="error-banner" role="alert" hidden></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
